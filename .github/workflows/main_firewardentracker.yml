name: Build and Deploy Combined Full-Stack App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # 3. Install and Build Frontend
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # 4. Install Backend Dependencies
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      # 5. Copy the frontend build folder into the backend folder
      - name: Copy Frontend Build to Backend
        run: cp -R frontend/build backend/

      # 6. Prepare Deployment Package
      - name: Prepare Deployment Package
        run: |
          mkdir deploy-package
          cp -R backend/* deploy-package/

      # 7. Debug: List contents of the deployment package
      - name: Debug - List Deployment Package Contents
        run: ls -la deploy-package

      # 8. Upload artifact for deployment job
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-app
          path: deploy-package

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 9. Download artifact from the build job
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: combined-app
          path: deploy-package

      # 10. Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 11. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'firewardentracker'      
          package: deploy-package
